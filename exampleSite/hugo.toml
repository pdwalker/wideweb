# Example / test site for the WideWeb theme.
# Run from the exampleSite/ directory:  hugo server -D
# (exampleSite/go.mod replaces github.com/pdwalker/wideweb with the repo root)

baseURL = "http://localhost:1313/"
title = "WideWeb Layout Tests"

enableRobotsTXT = true
defaultContentLanguage = "en"

[module]
  imports = [{ path = "github.com/pdwalker/wideweb" }]

[params]
  description = "Visual test pages for the WideWeb Hugo theme"

[menu]
  [[menu.main]]
    name = "Layout Tests"
    pageRef = "/tests"
    weight = 10
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 20
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 30
  [[menu.main]]
    name = "Search"
    weight = 40
    [menu.main.params]
      type = "search"
